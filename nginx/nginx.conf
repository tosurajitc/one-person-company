# ─────────────────────────────────────────────────────────────────────────────
# OPC Genie — nginx reverse-proxy config
# Routes /api/* → backend:8000, everything else → frontend:3000
# ─────────────────────────────────────────────────────────────────────────────

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    # Accept primary domain, wildcard founder subdomains, and custom domains
    server_name opcgenie.com *.opcgenie.com localhost _;

    client_max_body_size 20M;

    # Security headers (belt-and-suspenders — FastAPI also sets these)
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Raise client_body timeout so large JSON payloads upload fully
        proxy_request_buffering off;
        client_body_timeout     60s;
    }

    # ── AI Agent routes — extended timeouts for long Claude Sonnet calls ─────
    # Claude on large JSON inputs can take 60-120 s; the default 60s kills it.
    location /api/agent/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout  10s;
        proxy_request_buffering off;
        client_body_timeout    60s;
        client_max_body_size   10M;
    }

    location /docs {
        proxy_pass http://backend/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
    }

    # ── Next.js Frontend ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support for Next.js HMR (dev only; harmless in prod)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
